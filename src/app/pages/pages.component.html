<div class="app-shell" [class.sidebar-is-open]="isSidebarOpen">
    <app-navbar (menuToggle)="toggleSidebar()"></app-navbar>

    <app-sidebar
        [sideNavStatus]="isSidebarOpen"
        (navigationSelected)="closeSidebar()"
        (closeRequested)="closeSidebar()">
    </app-sidebar>

    <button
        *ngIf="isMobile && isSidebarOpen"
        type="button"
        class="sidebar-backdrop"
        aria-label="Cerrar menú de navegación"
        (click)="closeSidebar()">
    </button>

    <main>
        <div class="display-area">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
